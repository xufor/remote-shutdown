<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power</title>
<style>
  :root {
    --bg: #f3f4f1; --card: #ffffff; --ink: #1c1f1d; --muted: #6a716c; --line: #dfe2dc;
    --accent: #1f6f54; --danger: #b3372b; --ok: #1f6f54; --warn: #a86a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121413; --card: #1b1e1c; --ink: #e9ece9; --muted: #98a09a; --line: #2c312e;
      --accent: #4fb892; --danger: #e8695c; --ok: #4fb892; --warn: #e0a640;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 380px; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px 24px;
  }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .sub { margin: 2px 0 22px; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; font: inherit; color: inherit;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  button {
    padding: 14px 10px; font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink);
  }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  .msg { min-height: 1.5em; margin: 12px 0 0; font-size: .9rem; color: var(--danger); }
  [hidden] { display: none !important; }

  #progress { text-align: center; padding: 8px 0 4px; }
  .dot {
    width: 56px; height: 56px; margin: 4px auto 18px; border-radius: 50%;
    border: 4px solid var(--line); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  .dot.done { animation: none; border-color: var(--ok); background: var(--ok); }
  .dot.off { animation: none; border-color: var(--muted); background: transparent; }
  .dot.fail { animation: none; border-color: var(--danger); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation-duration: 4s; } }
  #ptitle { margin: 0 0 6px; font-size: 1.15rem; font-weight: 600; }
  #pdetail { margin: 0; color: var(--muted); font-size: .92rem; text-wrap: pretty; }
  #pback { margin-top: 20px; width: 100%; }
</style>
</head>
<body>
<main>
  <h1 id="host">&nbsp;</h1>
  <p class="sub" id="sub">&nbsp;</p>

  <form id="form" autocomplete="on">
    <label for="pw" id="pwlabel">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <div class="buttons">
      <button type="button" data-action="reboot">Reboot</button>
      <button type="button" data-action="shutdown" class="danger">Shut down</button>
    </div>
    <p class="msg" id="msg" role="alert"></p>
  </form>

  <section id="progress" hidden aria-live="polite">
    <div class="dot" id="dot"></div>
    <p id="ptitle"></p>
    <p id="pdetail"></p>
    <button type="button" id="pback" hidden>Back</button>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const form = $('form'), pw = $('pw'), msg = $('msg');
const buttons = [...form.querySelectorAll('button')];
let name = location.hostname, timer = null;

function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return 'up ' + (d ? d + 'd ' + h + 'h' : h ? h + 'h ' + m + 'm' : m + 'm');
}

async function getStatus(timeoutMs) {
  const r = await fetch('/api/status', { cache: 'no-store', signal: AbortSignal.timeout(timeoutMs) });
  if (!r.ok) throw new Error('status ' + r.status);
  return r.json();
}

function showIdle(st) {
  clearInterval(timer);
  $('progress').hidden = true;
  form.hidden = false;
  buttons.forEach(b => b.disabled = false);
  if (st) {
    name = st.hostname || name;
    $('host').textContent = name;
    document.title = name + ' power';
    $('sub').textContent = fmtUptime(st.uptime) + (st.dry_run ? ' · dry-run mode' : '');
    $('pwlabel').textContent = 'Password for ' + st.user;
  }
}

function showProgress(kind, title, detail, canGoBack) {
  form.hidden = true;
  $('progress').hidden = false;
  $('dot').className = 'dot ' + kind;
  $('ptitle').textContent = title;
  $('pdetail').textContent = detail;
  $('pback').hidden = !canGoBack;
}

// Watch the machine after a power action: it is "down" once it stops
// answering, and "back" once it answers again with a new boot id.
function watch(action, bootId) {
  const started = Date.now();
  let fails = 0, down = false, downAt = 0;
  const verb = action === 'reboot' ? 'Rebooting' : 'Shutting down';
  showProgress('', verb + ' ' + name + '…', 'Waiting for it to stop responding.');

  clearInterval(timer);
  timer = setInterval(async () => {
    let st = null;
    try { st = await getStatus(1500); } catch (e) {}
    const secs = Math.round((Date.now() - started) / 1000);

    if (st && st.boot_id !== bootId) {            // a fresh boot answered
      clearInterval(timer);
      if (action === 'reboot') {
        showProgress('done', name + ' is back online', 'Reboot finished in about ' + secs + ' seconds.', true);
      } else {
        showIdle(st);
      }
      return;
    }
    if (st) {                                      // same boot still answering
      fails = 0;
      if (down) return;
      if (!st.pending) {
        clearInterval(timer);
        if (st.error) showProgress('fail', 'That did not work', st.error, true);
        else showProgress('fail', 'Nothing happened', st.dry_run
          ? 'Dry-run mode: the password was accepted but no command was run.'
          : name + ' is still running.', true);
      } else if (secs > 120) {
        showProgress('', verb + ' ' + name + '…', 'Still responding after ' + secs + ' seconds. Something may be holding up the ' + action + '.');
      }
      return;
    }
    if (++fails < 3 || down) {                     // not answering
      if (down && action === 'shutdown' && Date.now() - downAt > 10000) {
        showProgress('off', name + ' is shut down', 'It has been unreachable for over 10 seconds. Safe to unplug.');
      }
      return;
    }
    down = true; downAt = Date.now();
    if (action === 'reboot') {
      showProgress('', name + ' is restarting…', 'It went offline after ' + secs + ' seconds. Waiting for it to come back.');
    } else {
      showProgress('off', name + ' has gone offline', 'Give it a few more seconds to finish powering off before unplugging.');
    }
  }, 1000);
}

async function act(action) {
  msg.textContent = '';
  if (!pw.value) { msg.textContent = 'Enter the password first.'; pw.focus(); return; }
  buttons.forEach(b => b.disabled = true);
  try {
    const r = await fetch('/api/power', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, password: pw.value }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || 'Request failed (' + r.status + ')');
    pw.value = '';
    watch(action, body.boot_id);
  } catch (e) {
    msg.textContent = e.message[0].toUpperCase() + e.message.slice(1) + '.';
    buttons.forEach(b => b.disabled = false);
    pw.select();
  }
}

buttons.forEach(b => b.addEventListener('click', () => act(b.dataset.action)));
form.addEventListener('submit', e => e.preventDefault());
$('pback').addEventListener('click', () => getStatus(3000).then(showIdle, () => showIdle()));

getStatus(3000).then(st => {
  showIdle(st);
  if (st.pending) watch(st.pending, st.boot_id);   // opened mid-shutdown
}).catch(() => { $('host').textContent = name; $('sub').textContent = 'not responding'; });
</script>
</body>
</html>
